[package]
name = "mouser-chat"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Mouser Contributors"]
description = "Mouser's chat mode as a plugin: the agent runs in Mouser (models, keys, tools), this program draws the conversation"
repository = "https://github.com/WeirdBrains/mouser-chat"
homepage = "https://github.com/WeirdBrains/mouser-chat"
readme = "README.md"
keywords = ["terminal", "mouser", "chat", "plugin"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/legacy"]

[dependencies]
mouser-mode-api = { features = ["markdown"], version = "0.1" }
serde_json = "1.0.128"

[dev-dependencies]
tempfile = "3.10.1"
anyhow = "1.0.89"

[lints.rust]
rust_2018_idioms = "warn"
unused_qualifications = "warn"
unexpected_cfgs = "warn"
